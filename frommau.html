<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Bảng danh sách ca sĩ  </h2>
    <table>
        <form >
            <tr>
                <td>
                    <label for="user"> Username </label>
                </td>
                <td>
                    <input type="text" placeholder="Enter Username">
                </td>
            </tr>
            <tr>
                <td>
                    <label for=""> Password</label>
                </td>
                <td>
                    <input type="password">
                </td>
            </tr>
            <tr>
                <td>
                    <label for=""> Web server</label>
                </td>
                <td>
                    <select>
                        <option>VietNam</option>
                        <option>Singapore</option>
                        <option>US</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for=""> Choose role</label>
                </td>
                <td>
                    <label><input type="radio" name="role" value="admin"> IT</label><br>
                    <label><input type="radio" name="role" value="user"> Dev</label><br>
                    <label><input type="radio" name="role" value="user"> BA</label><br>
                </td>
            </tr>
            <tr>
                <td><label for=""> Single Sign-on</label></td>
                <td>
                    <label><input type="checkbox" name="role" value="admin"> Zalo</label><br>
                    <label><input type="checkbox" name="role" value="user"> Mail</label><br>
                    <label><input type="checkbox" name="role" value="user"> Facebook</label><br>
                </td>
            </tr>
            <tr>
                <td><label for=""> Choose a file</label></td>
                <td><input type="file"></td>
            </tr>
            <tr>
                <td><label for=""> Pick a date</label></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td><label for=""> Pick a color</label></td>
                <td><input type="color"></td>
            </tr>
            <tr>
                <td><label for=""> Enter your name</label></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td> Introduction </td>
                <td><textarea></textarea></td>
            </tr>
            <tr>
                <td><input type="submit" value="Submit"></td>
                <td><input type="reset" value="Reset"></td>
            </tr>
        </form>
    </table>
</body>
</html>
