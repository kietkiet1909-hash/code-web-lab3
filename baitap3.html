<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested</title>
</head>
<body>
    <h2>Nested</h2>
    <table border="1">
        <tr>
            <th>Device</th>
            <th> Brand </th>
            <th>Specifications</th>
        </tr>    
        <tr>
            <td>Smartphone</td>
            <td>Apple</td>
            <td>
                <table border="1">
                    <tr>
                        <td>Model</td>
                        <td>Storage</td>
                    </tr>
                    <tr>
                        <td>iphone 12 Pro</td>
                        <td>128GB</td>
                    </tr>
                    <tr>
                        <td>iphone 13 Pro</td>
                        <td>256GB</td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>HP</td>
            <td>15.6"Display</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>Samsung</td>
            <td>10.5"Display</td>       
    </table>
</body>
</html>
