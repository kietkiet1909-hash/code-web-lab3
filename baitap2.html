<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>

<body>
    <h2>Registration Form</h2>
    <form>

        <table>
            <tr>
                <td>First Name :</td>
                <td><input type="text" name="firstname" placeholder="Enter First Name"></td>
            </tr>
            <tr>
                <td>Last Name :</td>
                <td><input type="text" name="lastname" placeholder="Enter Last Name"></td>
            </tr>
            <tr>
                <td>Email :</td>
                <td><input type="email" name="email" placeholder="Enter Email Address"></td>
            </tr>
            <tr>
                <td>Password :</td>
                <td><input type="password" name="password"></td>
            </tr>
            <tr>
                <td valign="top">Gender:</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male<br>
                    <input type="radio" name="gender" value="female"> Female<br>
                    <input type="radio" name="gender" value="other"> Other
                </td>
            </tr>
            <tr>
                <td>Age :</td>
                <td>
                    <select name="occupation" style="width: 180px;">
                        <option value="15">15</option>
                        <option value="25">25</option>
                        <option value="35">35</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td valign="top">Preferences :</td>
                <td>
                    <input type="checkbox" name="pref" value="acrylic"> Acrylic Painting<br>
                    <input type="checkbox" name="pref" value="oil"> Oil Painting<br>
                    <input type="checkbox" name="pref" value="watercolor"> Water Color Painting
                </td>
            </tr>
            <tr>
                <td>Select Occupation</td>
                <td>
                    <select name="occupation" style="width: 180px;">
                        <option value="student">Student</option>
                        <option value="developer">Developer</option>
                        <option value="designer">Designer</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td valign="top">Bio</td>
                <td>
                    <textarea name="bio" rows="6" cols="35" placeholder="Share few lines about yourself..."></textarea>
                </td>
            </tr>
            <tr>
                <td></td>
                <td style="padding-top: 5px;">
                    <input type="reset" value="RESET">
                    <input type="submit" value="SUBMIT">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
